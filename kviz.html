<!DOCTYPE html>
<html lang="hu">
 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esőerdő projekt - Kvíz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/script.js" defer></script>
 
</head>
 
<body>
 
  <header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid d-flex">
        <a class="navbar-brand" href="#">Esőerdő Szíve!</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse " id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link " aria-current="page" href="index.html">Főoldal</a>
            </li>
            <li class="nav-item">
              <a class="nav-link " href="allatok.html">Állatok</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="novenyek.html">Novények</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="kviz.html">Kvíz</a>
            </li>
             <li class="nav-item">
                            <a class="nav-link" href="retegek.html">Erdő Rétegei</a>
                        </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
 
  <main class="container py-5">
    <div class="card shadow mx-auto kviz-kartya">
      <div class="card-body p-4">
        <h1 class="text-center text-success mb-3">
          Esőerdő-kvíz
        </h1>
 
        <p class="text-center text-secondary">
          Teszteld a tudásodat az esőerdőkről!
        </p>
 
        <div id="quiz">
          <div class="progress mb-4" role="progressbar" aria-label="Kvíz haladása" aria-valuemin="0" aria-valuemax="100"
            aria-valuenow="0">
            <div id="progress" class="progress-bar bg-success"></div>
          </div>
 
          <h2 id="questionNumber" class="h5 mb-3"></h2>
          <p id="question" class="fs-5"></p>
 
          <div id="answers" class="d-grid gap-2"></div>
 
          <button id="nextButton" class="btn btn-success w-100 mt-4" disabled>
            Következő kérdés
          </button>
        </div>
 
        <div id="result" class="text-center d-none">
          <h2 class="text-success mb-4">Kvíz vége!</h2>
          <p class="fs-4 mb-2">
            Pontszám: <strong id="score"></strong>
          </p>
          <p class="fs-4 mb-4">
            Eredmény: <strong id="percentage"></strong>
          </p>
          <button id="restartButton" class="btn btn-outline-success">
            Új játék
          </button>
        </div>
      </div>
    </div>
  </main>
 
  <footer class="site-footer text-center">
    <p class="mb-0">© 2026 Esőerdő – Élő atlasz · Készítették: Vajda Patrik, Szekeres Gábor</p>
  </footer>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
 
</html>
